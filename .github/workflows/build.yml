name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: linux
            runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            output: bitwarden-html-converter-linux-amd64
          - os: windows
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            output: bitwarden-html-converter-windows-amd64.exe
          #- os: macos-amd64
          #  runs-on: macos-13
          #  goos: darwin
          #  goarch: amd64
          #  output: bitwarden-html-converter-macos-amd64
          - os: macos-arm64
            runs-on: macos-latest
            goos: darwin
            goarch: arm64
            output: bitwarden-html-converter-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install mingw

      - name: Tidy and download dependencies
        run: |
          go mod tidy
          go mod download

      - name: Build
        env:
          CGO_ENABLED: 1
        run: |
          go build -o ${{ matrix.output }} -ldflags="-s -w" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
