name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: linux
            runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            output: bitwarden-html-converter-linux-amd64
          - os: windows
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            output: bitwarden-html-converter-windows-amd64.exe
          - os: macos-amd64
            runs-on: macos-15-intel
            goos: darwin
            goarch: amd64
            output: bitwarden-html-converter-macos-amd64
            archive: bitwarden-html-converter-macos-amd64.zip
          - os: macos-arm64
            runs-on: macos-latest
            goos: darwin
            goarch: arm64
            output: bitwarden-html-converter-macos-arm64
            archive: bitwarden-html-converter-macos-arm64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install mingw

      - name: Tidy and download dependencies
        run: |
          go mod tidy
          go mod download

      - name: Build
        env:
          CGO_ENABLED: 1
        run: |
          go build -o ${{ matrix.output }} -ldflags="-s -w" .

      - name: Package macOS application
        if: startsWith(matrix.os, 'macos-')
        env:
          APP_NAME: Bitwarden HTML Converter.app
          BINARY_NAME: ${{ matrix.output }}
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: |
          APP_PATH="$APP_NAME"
          mkdir -p "$APP_PATH/Contents/MacOS"
          mv "$BINARY_NAME" "$APP_PATH/Contents/MacOS/bitwarden-html-converter"
          chmod +x "$APP_PATH/Contents/MacOS/bitwarden-html-converter"
          cat > "$APP_PATH/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>Bitwarden HTML Converter</string>
              <key>CFBundleExecutable</key>
              <string>bitwarden-html-converter</string>
              <key>CFBundleIdentifier</key>
              <string>com.pstraebler.bitwarden-html-converter</string>
              <key>CFBundleName</key>
              <string>Bitwarden HTML Converter</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
          </dict>
          </plist>
          PLIST
          ditto -c -k --keepParent "$APP_PATH" "$ARCHIVE_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.archive || matrix.output }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
