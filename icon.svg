<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B9BD5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B7CB5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#bg-gradient)"/>

  <!-- Document/Page with Table -->
  <g>
    <!-- Paper with folded corner -->
    <path d="M 70 50 L 186 50 L 186 120 L 206 140 L 206 206 L 70 206 Z" fill="white" stroke="none"/>
    <path d="M 186 120 L 206 140 L 186 140 Z" fill="#E0E0E0" stroke="none"/>

    <!-- Table structure -->
    <!-- Header row -->
    <rect x="80" y="65" width="110" height="20" fill="#4A90E2" opacity="0.3" rx="2"/>
    <!-- Grid lines -->
    <line x1="80" y1="85" x2="190" y2="85" stroke="#4A90E2" stroke-width="2" opacity="0.4"/>
    <line x1="80" y1="105" x2="190" y2="105" stroke="#4A90E2" stroke-width="1.5" opacity="0.3"/>
    <line x1="80" y1="125" x2="190" y2="125" stroke="#4A90E2" stroke-width="1.5" opacity="0.3"/>
    <line x1="80" y1="145" x2="190" y2="145" stroke="#4A90E2" stroke-width="1.5" opacity="0.3"/>
    <line x1="80" y1="165" x2="190" y2="165" stroke="#4A90E2" stroke-width="1.5" opacity="0.3"/>
    <line x1="80" y1="185" x2="190" y2="185" stroke="#4A90E2" stroke-width="1.5" opacity="0.3"/>
    <!-- Vertical lines -->
    <line x1="125" y1="65" x2="125" y2="185" stroke="#4A90E2" stroke-width="1.5" opacity="0.3"/>
    <line x1="160" y1="65" x2="160" y2="185" stroke="#4A90E2" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Key (unlocking/accessing passwords) - classic key shape -->
  <g transform="translate(30, 0)">
    <!-- Key head (round part) -->
    <circle cx="120" cy="110" r="18" fill="#FFB74D" stroke="white" stroke-width="3"/>
    <!-- Hole in key head -->
    <circle cx="120" cy="110" r="7" fill="white"/>

    <!-- Key shaft (long part) -->
    <rect x="135" y="104" width="55" height="12" fill="#FFB74D" stroke="white" stroke-width="3"/>

    <!-- Key bit (end part with teeth pointing down) -->
    <rect x="190" y="104" width="8" height="20" fill="#FFB74D" stroke="white" stroke-width="3"/>
    <!-- Notches (cuts in the teeth) -->
    <rect x="183" y="110" width="7" height="6" fill="white"/>
    <rect x="183" y="118" width="7" height="4" fill="white"/>
  </g>

  <!-- Eye icon (viewing/reading) -->
  <g opacity="0.9">
    <ellipse cx="138" cy="170" rx="35" ry="22" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <circle cx="138" cy="170" r="12" fill="white"/>
    <circle cx="138" cy="170" r="7" fill="#3B7CB5"/>
  </g>
</svg>